version: "3.9"

services:
  EchoLens-Insight:
    image: ghcr.io/666ghj/EchoLens-Insight:latest
    # Speed up mirror
    # image: ghcr.nju.edu.cn/666ghj/EchoLens-Insight:latest
    container_name: EchoLens-Insight
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - STREAMLIT_SERVER_ENABLE_FILE_WATCHER=false
    ports:
      - "5000:5000"
      - "8501:8501"
      - "8502:8502"
      - "8503:8503"
    volumes:
      - ./logs:/app/logs
      - ./final_reports:/app/final_reports
      - ./.env:/app/.env  
      - ./insight_engine_streamlit_reports:/app/insight_engine_streamlit_reports
      - ./media_engine_streamlit_reports:/app/media_engine_streamlit_reports
      - ./query_engine_streamlit_reports:/app/query_engine_streamlit_reports

  db:
    image: postgres:15
    container_name: EchoLens-Insight-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-EchoLens-Insight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-EchoLens-Insight}
      POSTGRES_DB: ${POSTGRES_DB:-EchoLens-Insight}
    ports:
      - "${POSTGRES_PORT:-5444}:5432"
    volumes:
      - ./db_data:/var/lib/postgresql/data
